name: Daily Repo Status

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/groq-repo-status.yml"
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: daily-repository-status
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Audit repository health and generate report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$GROQ_API_KEY" ]; then
            echo "Missing GEMINI_API_KEY repository secret."
            exit 1
          fi

          since="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          stale_before="$(date -u -d '30 days ago' '+%Y-%m-%dT%H:%M:%SZ')"

          repo_data="$(gh api "repos/$GITHUB_REPOSITORY")"
          root_data="$(gh api "repos/$GITHUB_REPOSITORY/contents")"
          issues_raw="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100")"
          pulls_raw="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100")"
          commits_raw="$(gh api "repos/$GITHUB_REPOSITORY/commits?since=$since&per_page=10")"
          releases_raw="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=5")"
          runs_raw="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=20")"
          workflows_raw="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100")"

          printf '%s' "$repo_data" > "$RUNNER_TEMP/repo.json"
          printf '%s' "$root_data" > "$RUNNER_TEMP/root.json"
          printf '%s' "$issues_raw" > "$RUNNER_TEMP/issues.json"
          printf '%s' "$pulls_raw" > "$RUNNER_TEMP/pulls.json"
          printf '%s' "$commits_raw" > "$RUNNER_TEMP/commits.json"
          printf '%s' "$releases_raw" > "$RUNNER_TEMP/releases.json"
          printf '%s' "$runs_raw" > "$RUNNER_TEMP/runs.json"
          printf '%s' "$workflows_raw" > "$RUNNER_TEMP/workflows.json"

          audit="$(jq -n \
            --slurpfile repo "$RUNNER_TEMP/repo.json" \
            --slurpfile root "$RUNNER_TEMP/root.json" \
            --slurpfile issues "$RUNNER_TEMP/issues.json" \
            --slurpfile pulls "$RUNNER_TEMP/pulls.json" \
            --slurpfile commits "$RUNNER_TEMP/commits.json" \
            --slurpfile releases "$RUNNER_TEMP/releases.json" \
            --slurpfile runs "$RUNNER_TEMP/runs.json" \
            --slurpfile workflows "$RUNNER_TEMP/workflows.json" \
            --arg since "$since" \
            --arg stale_before "$stale_before" \
            '
            ($root[0] | map(.name)) as $entries |
            ($entries | map(select(. != null))) as $files |
            {
              repository: {
                name: $repo[0].full_name,
                description: $repo[0].description,
                default_branch: $repo[0].default_branch,
                primary_language: $repo[0].language,
                archived: $repo[0].archived,
                stars: $repo[0].stargazers_count,
                open_issue_count: ([$issues[0][] | select(has("pull_request") | not)] | length),
                open_pull_request_count: ($pulls[0] | length),
                last_push: $repo[0].pushed_at
              },
              documentation_checks: {
                readme_present: (($files | map(ascii_downcase) | any(. == "readme.md" or . == "readme"))),
                license_present: (($files | map(ascii_downcase) | any(startswith("license")))),
                contributing_present: (($files | map(ascii_downcase) | any(startswith("contributing")))),
                code_of_conduct_present: (($files | map(ascii_downcase) | any(startswith("code_of_conduct")))),
                github_directory_present: (($files | map(ascii_downcase) | any(. == ".github"))),
                root_test_directory_present: (($files | map(ascii_downcase) | any(. == "test" or . == "tests" or . == "spec"))),
                root_dependency_manifests: ($files | map(select(
                  . == "package.json" or . == "pom.xml" or . == "build.gradle" or
                  . == "build.gradle.kts" or . == "requirements.txt" or . == "pyproject.toml" or
                  . == "Cargo.toml" or . == "go.mod" or . == "composer.json"
                )))
              },
              automation: {
                workflow_count: ($workflows[0].total_count // 0),
                workflows: [($workflows[0].workflows // [])[:25][] | {name,path,state}],
                recent_runs: [($runs[0].workflow_runs // [])[:10][] |
                  {name,status,conclusion,created_at,url:.html_url}],
                latest_runs_by_workflow: [
                  ($runs[0].workflow_runs // []) | group_by(.name)[] |
                  max_by(.created_at) | {name,conclusion,created_at,url:.html_url}
                ],
                failed_runs_last_7_days: [($runs[0].workflow_runs // [])[] |
                  select(.created_at >= $since and .conclusion == "failure") |
                  {name,created_at,url:.html_url}]
              },
              maintenance: {
                stale_open_issues: [$issues[0][] |
                  select(has("pull_request") | not) |
                  select(.updated_at < $stale_before) |
                  {number,title,updated_at,url:.html_url}] | .[:10],
                stale_open_pull_requests: [$pulls[0][] |
                  select(.updated_at < $stale_before) |
                  {number,title,updated_at,url:.html_url}] | .[:10]
              },
              recent_activity: {
                commits: [$commits[0][] | {sha:(.sha[:8]),message:(.commit.message | split("\n")[0]),date:.commit.author.date}] | .[:10],
                releases: [$releases[0][] |
                  select((.published_at // "") >= $since) |
                  {name,tag_name,published_at,url:.html_url}]
              }
            }')"

          request="$(jq -n \
            --argjson audit "$audit" \
            '{
              model:"openai/gpt-oss-20b",
              max_completion_tokens:900,
              messages:[
                {
                  role:"system",
                  content:"You are a strict repository health analyst. Use only explicit fields in the supplied JSON; do not infer unobserved facts. Distinguish historical failures from current status: use latest_runs_by_workflow, and call a workflow currently failing only if its latest run has conclusion failure. Older failures followed by a later success are resolved historical failures. Do not count this currently executing report run because it is not yet present in the API snapshot. Report actual open_issue_count separately from open_pull_request_count. Documentation and test checks refer ONLY to root-level files/directories; never claim nested paths are absent. Do not claim tests passed, code executed, dependency vulnerabilities, missing README badges, or missing releases unless the JSON explicitly proves it. Separate confirmed findings from optional recommendations. Include up to three prioritized next actions. If no confirmed problem remains, say so. Keep under 300 words."
                },
                {
                  role:"user",
                  content:("Audit this repository and summarize its health:\n" + ($audit | tojson))
                }
              ]
            }')"

          response="$(curl --fail-with-body --silent --show-error \
            https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$request")"

          report="$(jq -er '.choices[0].message.content | select(type == "string" and length > 0)' <<< "$response")"

          title="[repo-health] $(date -u +%Y-%m-%d)"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$report"
            echo "Updated existing daily health issue #$existing."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$report"
            echo "Created daily health issue."
          fi
