name: Validate GitHub Workflows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: validate-workflows
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse every workflow YAML file
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.parse_file(file); puts "Valid YAML: #{file}" }' .github/workflows/*.yml
